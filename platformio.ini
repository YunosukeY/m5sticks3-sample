[env:m5sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
; StickS3 は ESP32-S3-PICO-1-N8R8 (Flash 8MB Quad / PSRAM 8MB Octal)。
; esp32-s3-devkitc-1 は PSRAM 無しの N8 に解決されるため n8r8 版を使う。
board = esp32-s3-devkitc1-n8r8

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -Wall -Wextra

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 厳密固定（範囲指定を使わない）。
; M5Unified の M5GFX 依存が ">=0.2.28" で上限を持たないため、M5GFX も明示する。
lib_deps =
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
