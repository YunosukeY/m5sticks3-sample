; pio run は env を指定しないと全部を対象にするため、既定を明示して
; テスト用の native env を巻き込まないようにする。
[platformio]
default_envs = m5sticks3

[env:m5sticks3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
; StickS3 は N8R8。esp32-s3-devkitc-1 は PSRAM 無しの N8 に解決されるため使えない。
board = esp32-s3-devkitc1-n8r8

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Boost.SML はヘッダのみ使う。理由は lib_ignore のコメントを参照。
    -I${PROJECT_LIBDEPS_DIR}/${PIOENV}/sml/include

; build_src_flags は src/ のコンパイルにのみ渡される。
; lib/ の自作ライブラリにも lib_deps の外部ライブラリにも効かない。
; lib/ を作る際は lib/<name>/library.json の build.flags に同じものを書くこと。
; -Wundef / -Wconversion は M5GFX や FreeRTOS のヘッダから 300 件超出るため入れない。
build_src_flags =
    -Wall
    -Wextra
    -Wshadow
    -Wdouble-promotion
    -Wformat=2

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; M5Unified の M5GFX 依存が ">=0.2.28" で上限を持たないため、M5GFX も明示する。
; Boost.SML は PlatformIO レジストリに無いため git から取得する。
lib_deps =
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
    https://github.com/boost-ext/sml.git#v1.2.0

; SML のリポジトリには benchmark/ や example/ の .cpp が含まれており、
; そのままだと Boost.MSM を要求してビルドが落ちる。LDF の対象から外し、
; build_flags の -I でヘッダだけを見せる。
lib_ignore = sml

; ホスト上でテストを走らせるための env。
[env:native]
platform = native
test_framework = unity
